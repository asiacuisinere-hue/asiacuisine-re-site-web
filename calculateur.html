<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur Nutritionnel - Asiacuisine.re</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculateur de besoin calorique</h1>
        <p>Estimez votre besoin calorique journalier pour maintenir votre poids actuel.</p>
        
        <form id="calorie-form">
            <label for="gender">Sexe:</label>
            <select id="gender" name="gender" required>
                <option value="male">Homme</option>
                <option value="female">Femme</option>
            </select>

            <label for="age">Âge (années):</label>
            <input type="number" id="age" name="age" required>

            <label for="weight">Poids (kg):</label>
            <input type="number" id="weight" name="weight" required>

            <label for="height">Taille (cm):</label>
            <input type="number" id="height" name="height" required>

            <label for="activity">Niveau d'activité:</label>
            <select id="activity" name="activity" required>
                <option value="1.2">Sédentaire (peu ou pas d'exercice)</option>
                <option value="1.375">Léger (exercice 1-3 jours/semaine)</option>
                <option value="1.55">Modéré (exercice 3-5 jours/semaine)</option>
                <option value="1.725">Actif (exercice 6-7 jours/semaine)</option>
                <option value="1.9">Très actif (exercice intense tous les jours)</option>
            </select>

            <button type="submit">Calculer</button>
        </form>

        <div id="result-container" style="margin-top: 20px;"></div>

        <div style="margin-top: 40px; text-align: center;">
            <h3>Intéressé par nos formules d'abonnement ?</h3>
            <p>Recevez des plats adaptés à vos besoins directement chez vous.</p>
            <a href="/menu.html#abonnement" class="button">Découvrir nos formules</a>
        </div>
    </div>

    <script>
        document.getElementById('calorie-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const gender = document.getElementById('gender').value;
            const age = parseInt(document.getElementById('age').value);
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const activity = parseFloat(document.getElementById('activity').value);

            let bmr = 0;
            if (gender === 'male') {
                bmr = 88.362 + (13.397 * weight) + (4.799 * height) - (5.677 * age);
            } else {
                bmr = 447.593 + (9.247 * weight) + (3.098 * height) - (4.330 * age);
            }

            const dailyCalories = Math.round(bmr * activity);

            const resultContainer = document.getElementById('result-container');
            resultContainer.innerHTML = `
                <h3>Résultat</h3>
                <p>Votre métabolisme de base (BMR) est d'environ <strong>${Math.round(bmr)} calories</strong>.</p>
                <p>Pour maintenir votre poids actuel, votre besoin calorique journalier est d'environ <strong>${dailyCalories} calories</strong>.</p>
            `;
        });
    </script>
</body>
</html>
