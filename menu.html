<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menus de la Semaine – Asiacuisine.re | Plats asiatiques maison à La Réunion</title>
    <meta name="description" content="Découvrez les menus de la semaine : bentos, viandes marinées et plats asiatiques maison préparés avec des produits frais à La Réunion.">
    
    <link rel="stylesheet" href="style.css?v=1.5">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://www.google.com/recaptcha/api.js?render=6LcYThAsAAAAAOV055t1Nvd5Uo94kcTmPUBd-cmq" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="mobile-app-layout">

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><img src="favicon.png" alt="Asiacuisine.re Logo"></a>
            <ul class="nav-links">
                <li><a href="index.html" data-i18n="menu.back_to_home">← Retour</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="menu-container app-style">
            
            <!-- MESSAGE DE FERMETURE (PRIORITAIRE) -->
            <div id="menu-override-message" class="menu-override" style="display: none; margin-bottom: 2rem;">
                <div class="menu-info-box" style="border-left-color: #f59e0b; background: #fffbeb;">
                    <p></p>
                </div>
            </div>

            <!-- PROGRESS BAR -->
            <div class="stepper-progress">
                <div class="step active" data-step="1"><span>1</span></div>
                <div class="step-line"></div>
                <div class="step" data-step="2"><span>2</span></div>
                <div class="step-line"></div>
                <div class="step" data-step="3"><span>3</span></div>
            </div>

            <form id="whatsapp-order-form">
                
                <!-- STEP 1: SÉLECTION -->
                <section id="step-1" class="step-section active">
                    <h1 data-i18n="menu.title" class="step-title">Votre sélection</h1>
                    
                    <!-- SÉLECTEUR D'UNIVERS -->
                    <div class="universe-selector">
                        <button type="button" class="universe-btn active" data-universe="weekly">
                            <span class="uni-icon">🍱</span>
                            <span class="uni-label">Menus Semaine</span>
                        </button>
                        <button type="button" class="universe-btn" data-universe="special" id="universe-btn-special" style="display: none;">
                            <span class="uni-icon">✨</span>
                            <span class="uni-label">Offre Spéciale</span>
                        </button>
                    </div>

                    <div id="announcement-container" style="display: none; margin-bottom: 1.5rem;">
                        <div id="announcement-content"></div>
                    </div>
            
                    <!-- ZONE MENUS HEBDOS -->
                    <div id="weekly-universe-content">
                        <div id="weekly-menu-content" class="menu-info-box">
                            <h2 data-i18n="menu.weekly_content_title">Contenu cette semaine :</h2>
                            <p id="content-decouverte"></p>
                            <p id="content-standard"></p>
                            <p id="content-confort"></p>
                            <p id="content-duo"></p>
                        </div>

                        <div id="formula-cards-container">
                            <h2 data-i18n="menu.choose_formula_title">Choisissez votre formule</h2>
                            <div class="formula-grid-scroller">
                                <div class="formula-card" id="card-decouverte">
                                    <label for="formule-decouverte" class="formula-label">
                                        <div class="card-header">
                                            <input type="radio" name="formule" value="Formule Découverte" id="formule-decouverte">
                                            <span class="custom-radio"></span>
                                            <h3 data-i18n="menu.discovery_title">🔹 Découverte</h3>
                                        </div>
                                        <p class="price" id="price-decouverte">-- €</p>
                                        <p class="desc" data-i18n="menu.discovery_desc">3 plats<br>📍 Retrait Saint-André</p>
                                    </label>
                                </div>

                                <div class="formula-card" id="card-standard">
                                    <label for="formule-standard" class="formula-label">
                                        <div class="card-header">
                                            <input type="radio" name="formule" value="Formule Standard" id="formule-standard">
                                            <span class="custom-radio"></span>
                                            <h3 data-i18n="menu.standard_title">⭐ Standard</h3>
                                        </div>
                                        <p class="price" id="price-standard">-- €</p>
                                        <p class="desc" data-i18n="menu.standard_desc">5 plats<br>🚚 Livraison incluse</p>
                                    </label>
                                    <div class="sub-options">
                                        <label class="sub-option-item"><input type="radio" name="optionStandard" value="Option A"> <span>Option A</span></label>
                                        <label class="sub-option-item"><input type="radio" name="optionStandard" value="Option B"> <span>Option B</span></label>
                                    </div>
                                </div>

                                <div class="formula-card" id="card-confort">
                                    <label for="formule-confort" class="formula-label">
                                        <div class="card-header">
                                            <input type="radio" name="formule" value="Formule Confort" id="formule-confort">
                                            <span class="custom-radio"></span>
                                            <h3 data-i18n="menu.comfort_title">💎 Confort</h3>
                                        </div>
                                        <p class="price" id="price-confort">-- €</p>
                                        <p class="desc" data-i18n="menu.comfort_desc">5 plats<br>🏡 Livraison domicile</p>
                                    </label>
                                    <div class="sub-options">
                                        <label class="sub-option-item"><input type="radio" name="optionConfort" value="Option A"> <span>Option A</span></label>
                                        <label class="sub-option-item"><input type="radio" name="optionConfort" value="Option B"> <span>Option B</span></label>
                                    </div>
                                </div>

                                <div class="formula-card" id="card-duo">
                                    <label for="formule-duo" class="formula-label">
                                        <div class="card-header">
                                            <input type="radio" name="formule" value="Option Duo" id="formule-duo">
                                            <span class="custom-radio"></span>
                                            <h3 data-i18n="menu.duo_title">👥 Duo</h3>
                                        </div>
                                        <p class="price" id="price-duo">-- €</p>
                                        <p class="desc" data-i18n="menu.duo_desc"><strong>2 Formules identiques</strong><br>Livraison commune</p>
                                    </label>
                                    <div class="sub-options">
                                        <label class="sub-option-item"><input type="radio" name="optionDuo" value="Option A"> <span>Option A</span></label>
                                        <label class="sub-option-item"><input type="radio" name="optionDuo" value="Option B"> <span>Option B</span></label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ZONE OFFRES SPÉCIALES -->
                    <div id="special-universe-content" style="display: none;">
                        <div id="special-offer-container"></div>
                        <div id="special-offer-summary"></div>
                    </div>
                </section>

                <!-- STEP 2: LOGISTIQUE -->
                <section id="step-2" class="step-section">
                    <h2 class="step-title">Date & Lieu</h2>
                    <div class="form-group mb-6">
                        <label for="livraison" data-i18n="menu.label_delivery_city">Ville de livraison</label>
                        <select id="livraison" name="livraison" class="app-input">
                            <option value="" data-i18n="menu.option_select_city">Où souhaitez-vous être livré ?</option>
                            <option value="Bras-Panon">Bras-Panon</option><option value="Cilaos">Cilaos</option>
                            <option value="Entre-Deux">Entre-Deux</option><option value="L'Étang-Salé">L'Étang-Salé</option>
                            <option value="La Plaine-des-Palmistes">La Plaine-des-Palmistes</option><option value="La Possession">La Possession</option>
                            <option value="Le Port">Le Port</option><option value="Le Tampon">Le Tampon</option>
                            <option value="Les Avirons">Les Avirons</option><option value="Les Trois-Bassins">Les Trois-Bassins</option>
                            <option value="Petite-Île">Petite-Île</option><option value="Saint-André">Saint-André</option>
                            <option value="Saint-Benoît">Saint-Benoît</option><option value="Saint-Denis">Saint-Denis</option>
                            <option value="Saint-Joseph">Saint-Joseph</option><option value="Saint-Leu">Saint-Leu</option>
                            <option value="Saint-Louis">Saint-Louis</option><option value="Saint-Paul">Saint-Paul</option>
                            <option value="Saint-Philippe">Saint-Philippe</option><option value="Saint-Pierre">Saint-Pierre</option>
                            <option value="Sainte-Marie">Sainte-Marie</option><option value="Sainte-Rose">Sainte-Rose</option>
                            <option value="Sainte-Suzanne">Sainte-Suzanne</option><option value="Salazie">Salazie</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="menu.label_delivery_date">Choisissez votre date</label>
                        <input type="hidden" id="jour" name="jour">
                        <div id="calendar-container" class="app-calendar"></div>
                        <div class="selected-date-badge">
                            <span id="selected-date-display">Aucune date sélectionnée</span>
                        </div>
                    </div>
                </section>

                <!-- STEP 3: COORDONNÉES -->
                <section id="step-3" class="step-section">
                    <h2 class="step-title">Vos Coordonnées</h2>
                    <div class="form-grid">
                        <div class="form-group"><label for="nom" data-i18n="menu.label_nom">Nom</label><input type="text" id="nom" name="nom" class="app-input" required></div>
                        <div class="form-group"><label for="prenom" data-i18n="menu.label_prenom">Prénom</label><input type="text" id="prenom" name="prenom" class="app-input" required></div>
                        <div class="form-group"><label for="telephone" data-i18n="menu.label_phone">Téléphone</label><input type="tel" id="telephone" name="telephone" class="app-input" required></div>
                        <div class="form-group"><label for="email" data-i18n="menu.label_email">Email</label><input type="email" id="email" name="email" class="app-input" required></div>
                    </div>
                    <div id="cgv-checkbox-container" class="checkbox-group-app">
                        <input type="checkbox" id="cgv_acceptance" name="cgv_acceptance" required>
                        <label for="cgv_acceptance" data-i18n="booking.cgv_checkbox_label">J'accepte les Conditions Générales de Vente (CGV)</label>
                    </div>
                </section>

                <!-- STICKY BOTTOM BAR -->
                <div class="sticky-bottom-bar">
                    <div class="bar-info">
                        <span class="bar-label">Total estimé</span>
                        <span class="bar-total" id="sticky-total">0.00€</span>
                    </div>
                    <div class="bar-actions">
                        <button type="button" id="prev-step" class="btn-prev" style="display: none;">Retour</button>
                        <button type="button" id="next-step" class="btn-next">Suivant</button>
                        <button type="submit" id="submit-order" class="btn-submit" style="display: none;" data-i18n="menu.to_order_cta">Commander</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
    <script src="menu.js?v=1.5" defer></script>
    <script src="script.js" defer></script>

    <section id="contact" class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Contact</h3>
                    <p><a data-phone="33767644714" class="contact-link-with-icon js-whatsapp-link" title="WhatsApp"><img src="assets/images/logos/Digital_Glyph_Green.svg" alt="WhatsApp Logo" class="contact-icon"><span>WhatsApp</span></a></p>
                    <p>✉️ <a href="mailto:contact@asiacuisine.re">contact@asiacuisine.re</a></p>
                </div>
                <div class="footer-section">
                    <h3>Suivez-moi</h3>
                    <div class="footer-social-links">
                        <a href="https://www.facebook.com/profile.php?id=100090025515349" target="_blank" rel="noopener noreferrer"><img src="assets/images/logos/Facebook_Logo_Primary.png" alt="Facebook Logo" class="footer-social-icon"></a>
                        <a href="https://www.instagram.com/asiacuisine.re/" target="_blank" rel="noopener noreferrer"><img src="assets/images/logos/Instagram_Glyph_Gradient.svg" alt="Instagram Logo" class="footer-social-icon"></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 Asiacuisine.re - <a href="legal.html" target="_blank">Mentions Légales</a> | <a href="cgv.html" target="_blank">CGV</a></p>
            </div>
        </div>
    </section>
</body>
</html>
